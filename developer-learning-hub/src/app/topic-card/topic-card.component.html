
<div class="topic-card-row">

  <!-- Main topic button -->
  <button
    class="topic-card"
    (click)="openTopic()">

    <!-- Inputs received from parent -->
    <span class="topic-number">
      {{ learningTopicIndex() }}
    </span>

    <span class="topic-title">
      {{ learningTopic() }}
    </span>

  </button>


  <!-- Expands or collapses subtopics -->
  <button
    class="details-toggle"
    (click)="toggleDetails()">

    @if (isExpandable()) {
      ▼
    } @else {
      ▶
    }

  </button>

</div>


<!-- Show subtopics only when this card is expanded -->
@if (isExpandable()) {

  <div class="topic-details">

    @for (item of subTopics(); track item; let j = $index) {

      <!-- Custom pipe creates labels like 1.1, 1.2 -->
      <p>
        {{ item | subTopicLabel: learningTopicIndex(): j + 1 }}
      </p>

    }

  </div>

}
