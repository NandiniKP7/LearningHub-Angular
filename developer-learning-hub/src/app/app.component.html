
<section class="learning-hub">

  <!-- String interpolation: title comes from app.component.ts -->
  <h1>{{ title }}</h1>


  <!-- Main navigation buttons -->
  <div class="technology-buttons">

    <!-- Property binding + Angular routing -->
    <button
      [disabled]="disabledButton"
      routerLink="/angular"
      routerLinkActive="active">
      Angular
    </button>

    <button
      [disabled]="disabledButton"
      routerLink="/typescript"
      routerLinkActive="active">
      TypeScript
    </button>

    <button
      [disabled]="disabledButton"
      routerLink="/csharp"
      routerLinkActive="active">
      C#
    </button>

  </div>


  <!-- Displays the component that matches the current route -->
  <router-outlet></router-outlet>


  <!-- Simple two-way binding practice -->
  <div class="learning-goal">

    <h3>What do you want to learn?</h3>

    <!-- Two-way binding with technology from app.component.ts -->
    <input [(ngModel)]="technology">

    <!-- String interpolation -->
    <p>Current Goal: {{ technology }}</p>

  </div>

</section>
