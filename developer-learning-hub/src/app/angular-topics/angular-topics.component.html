<section class="topics-section">

  <div class="topics-header">

    <img
      class="angular-logo"
      [src]="imageUrl"
      alt="Angular logo">

    <h1>{{ title }}</h1>

  </div>


  <div class="topics-list">

    @for (angularLearningTopic of angularLearningTopics; track angularLearningTopic; let i = $index) {

      <div class="topic-row">

        <span class="topic-number">
          {{ i + 1 }}
        </span>

        <app-topic-card
          [learningTopic]="angularLearningTopic"
          (selectedLearningTopic)="onTopicSelected($event)">
        </app-topic-card>

      </div>

    }
    @empty {

      <p>No Angular topics available.</p>

    }

  </div>

</section>
